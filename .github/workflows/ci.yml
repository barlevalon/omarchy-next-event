name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install runtime and test dependencies
        run: pacman -Syu --noconfirm --needed git python nodejs
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test
        run: |
          /usr/bin/python3 -S test_bundle.py
          /usr/bin/python3 -S next_event.py --self-test
          /usr/bin/python3 -S test_feed_config.py
          node privacy_test.cjs
          node feed_settings_test.cjs
          node coordination_test.cjs
      - name: Check marketplace security baseline
        env:
          CHECK_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CHECK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_COMMIT: 0332cfe6753cbd10df15aa4910bb2f06c7362bd6
        run: |
          policy="$(mktemp -d)"
          git -C "$policy" init --quiet
          git -C "$policy" remote add origin https://github.com/omacom/omarchy-plugin-marketplace.git
          git -C "$policy" fetch --quiet --depth 1 origin "$POLICY_COMMIT"
          git -C "$policy" checkout --quiet --detach "$POLICY_COMMIT"
          test "$(git -C "$policy" rev-parse HEAD)" = "$POLICY_COMMIT"
          export POLICY_DIR="$policy"
          node --input-type=module <<'JS'
          import { pathToFileURL } from "node:url";
          const { runSecurityBaseline } = await import(pathToFileURL(
            process.env.POLICY_DIR + "/scripts/security-baseline-scanner.mjs"
          ));
          const result = await runSecurityBaseline(
            "https://github.com/" + process.env.CHECK_REPOSITORY,
            process.env.CHECK_COMMIT
          );
          console.log(JSON.stringify(result, null, 2));
          if (result.outcome !== "passed") process.exit(1);
          JS
